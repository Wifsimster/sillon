name: no-added-comments

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-added-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node --test scripts/__tests__/check-no-added-comments.test.mjs
      - run: node scripts/check-no-added-comments.mjs
