name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # The Robolectric `*Renders` tests draw screens on synthetic data (no server, no real library).
      - name: Upload UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: |
            app/build/*-renders/**/*.png
            app/build/outputs/renders/**/*.png
          if-no-files-found: ignore

      # Fails the build on any lint error (no baseline): new errors show up on the PR.
      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

      - name: Install libmpv for the desktop tests
        run: sudo apt-get update && sudo apt-get install -y libmpv2

      - name: Run desktop unit tests
        run: ./gradlew :desktop:test --stacktrace

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests/test
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sillon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sillon-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build release AAB (App Bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/upload-keystore.jks"
            export KEYSTORE_FILE="${{ github.workspace }}/upload-keystore.jks"
          else
            echo "No KEYSTORE_BASE64 secret set — AAB will be debug-signed (not store-ready)."
          fi
          ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sillon-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Verify 16 KB native-lib alignment
        run: |
          chmod +x scripts/check-16kb-alignment.sh
          ./scripts/check-16kb-alignment.sh app/build/outputs/bundle/release/app-release.aab

      - name: Stage download assets (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          (cd dist && sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sillon — latest build
          prerelease: true
          make_latest: false
          files: |
            dist/app-debug.apk
            dist/app-release.apk
            dist/SHA256SUMS.txt
          body: |
            Automatic build of `main` (commit ${{ github.sha }}).
            No GitHub account needed — tap a link below on your phone.

            | Download | Size | Use it for |
            |---|---|---|
            | [**app-release.apk**](https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk) | ~4 MB | Everyday use (minified) |
            | [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk) | ~25 MB | Debugging / bug reports |

            Then allow *install from unknown sources* when Android asks, and open the file to install.

            Both APKs are debug-signed for sideloading. Verify a download against
            [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/latest/SHA256SUMS.txt)
            with `sha256sum -c SHA256SUMS.txt`.

            Looking for a stable version instead? See the
            [latest release](https://github.com/${{ github.repository }}/releases/latest).

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch libmpv
        run: bash scripts/fetch-libmpv.sh

      - name: Run desktop unit tests
        run: ./gradlew :desktop:test --stacktrace

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-report
          path: desktop/build/reports/tests/test
          if-no-files-found: ignore

      - name: Build the app as it ships
        run: ./gradlew :desktop:createReleaseDistributable --stacktrace

      - name: Self-test the app as it ships
        run: |
          desktop/build/compose/binaries/main-release/app/Sillon/Sillon.exe --self-test "$PWD/self-test.txt" || true
          cat self-test.txt
          test "$(grep -c '^ok' self-test.txt)" = "5"

      - name: Build the Windows installer
        run: ./gradlew :desktop:packageReleaseMsi --stacktrace

      - name: Put Sillon's logo in the installer
        run: pwsh -File scripts/brand-installer.ps1 -Msi "$(ls desktop/build/compose/binaries/main-release/msi/*.msi)" -Banner desktop/installer/banner.bmp -Dialog desktop/installer/dialog.bmp

      - name: Update an installed Sillon with this installer
        run: |
          curl -fsSL --retry 3 -o previous.msi https://github.com/Wifsimster/sillon/releases/download/v1.27.0/Sillon-windows-x64.msi
          cmd //c "start /wait msiexec /i previous.msi /qn /norestart"
          installed="$(cygpath -u "$LOCALAPPDATA")/Sillon/Sillon.exe"
          test -f "$installed"
          "$installed" --self-test "$PWD/before.txt" || true
          echo "before: $(grep -c '^ok' before.txt) checks"
          test "$(grep -c '^ok' before.txt)" = "4"
          next="$(cygpath -w "$(ls "$PWD"/desktop/build/compose/binaries/main-release/msi/*.msi)")"
          desktop/build/compose/binaries/main-release/app/Sillon/Sillon.exe --install-update "$next" "$(cygpath -w "$installed")"
          log="$(cygpath -u "$TEMP")/sillon-update/install.log"
          for i in $(seq 1 150); do
            if [ -f "$log" ] && tr -d '\0' < "$log" | grep -q "Installation success or error status"; then break; fi
            sleep 2
          done
          tr -d '\0' < "$log" | grep "Installation success or error status" | tail -n 1
          tr -d '\0' < "$log" | grep -q "Installation success or error status: 0"
          for i in $(seq 1 30); do
            if tasklist //FI "IMAGENAME eq Sillon.exe" | grep -qi "Sillon.exe"; then echo "Sillon started again"; break; fi
            sleep 2
          done
          tasklist //FI "IMAGENAME eq Sillon.exe" | grep -qi "Sillon.exe"
          taskkill //F //IM Sillon.exe
          sleep 3
          "$installed" --self-test "$PWD/after.txt" || true
          cat after.txt
          test "$(grep -c '^ok' after.txt)" = "5"

      - name: Stage the installer
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main-release/msi/*.msi dist/Sillon-windows-x64.msi
          (cd dist && sha256sum Sillon-windows-x64.msi > SHA256SUMS-windows.txt)
          cat dist/SHA256SUMS-windows.txt

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sillon-windows-msi
          path: dist/*
          if-no-files-found: error

  publish-desktop:
    if: github.ref == 'refs/heads/main'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: sillon-windows-msi
          path: dist

      - name: Add the installer to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest dist/Sillon-windows-x64.msi dist/SHA256SUMS-windows.txt --clobber --repo "${{ github.repository }}"
